name: Vulnerability scan

# OSV-Scanner over every lockfile in the repo (uv.lock for the SDK's dev
# and runtime dependencies, tools/spec-gen/package-lock.json for the spec
# generator) against the OSV database, which aggregates PyPA, GitHub and
# npm advisories.
#
# - On a PR: reports only vulnerabilities the PR introduces (diff against
#   the base branch) and fails the job if there are any.
# - On push to main and weekly: full scan; fails on any known vulnerability
#   and uploads SARIF to Security > Code scanning.
#
# Complements the Dependabot alerts + security updates enabled on the repo,
# which open fix PRs; this job is what blocks a regression from landing.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Monday 06:17 UTC
  workflow_dispatch:

permissions: {}

jobs:
  scan-pr:
    name: osv-scanner (PR diff)
    if: github.event_name == 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write # SARIF upload
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --include-git-root
        -r
        ./

  scan-full:
    name: osv-scanner (full)
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write # SARIF upload
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@a345acffa64b0eaede81a3d9aae6141214d9c8fc # v2.6.0
    with:
      scan-args: |-
        --include-git-root
        -r
        ./
