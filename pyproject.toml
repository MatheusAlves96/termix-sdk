[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "termix-sdk"
dynamic = ["version"]
description = "Unofficial Python client SDK for the Termix REST API"
readme = "README.md"
license = "MIT"
authors = [{ name = "Matheus Alves", email = "matheusalves965@gmail.com" }]
requires-python = ">=3.10"
keywords = ["termix", "ssh", "sdk", "api-client"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",
    "typing-extensions>=4.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "mypy>=1.10",
    "ruff>=0.6",
    "pytest-cov>=6.0",
]

[project.urls]
Homepage = "https://github.com/MatheusAlves96/termix-sdk"
Issues = "https://github.com/MatheusAlves96/termix-sdk/issues"
Changelog = "https://github.com/MatheusAlves96/termix-sdk/blob/main/CHANGELOG.md"

[tool.hatch.version]
path = "src/termix_sdk/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/termix_sdk"]

[tool.hatch.build.targets.sdist]
# spec/ (multi-MB IR dumps) and tools/ (the generators) are inputs to the
# build, not part of the distributed package.
only-include = ["src", "tests", "examples", "CHANGELOG.md", "CONTRIBUTING.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "live: runs against a real Termix instance (opt-in via TERMIX_LIVE=1)",
]

[tool.coverage.run]
source = ["termix_sdk"]
branch = true

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# tools/sdk-gen/generate.py rewrites a marked import region in these two
# files in place (docs/sdk-plan.md phases F3/F4). Ruff's isort otherwise
# wants to merge that region with the hand-written imports above it,
# which would defeat rewrite_region()'s ability to re-target the marker
# on the next run.
"src/termix_sdk/_client.py" = ["I001"]
"src/termix_sdk/_async_client.py" = ["I001"]

[tool.mypy]
python_version = "3.10"
files = ["src/termix_sdk", "examples"]
mypy_path = "src"
ignore_missing_imports = true
