# Generated code (resources/, models/, types/, tests/contract/) is excluded so
# the per-PR delta reflects the hand-written core. Both checks are
# informational: they comment on the PR but never fail it.
coverage:
  status:
    project:
      default:
        informational: true
    patch:
      default:
        informational: true

ignore:
  - "src/termix_sdk/resources/**"
  - "src/termix_sdk/models/**"
  - "src/termix_sdk/types/**"
  - "tests/**"

comment:
  layout: "condensed_header, diff, files"
  require_changes: true
